<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davin Scientist | Kontak</title>
    <link rel="stylesheet" href="asset/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body data-page="contact">
    <div id="loader"><span class="loader-line">$ booting</span></div>

    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
            <span class="prompt">davin@portfolio</span><span class="prompt-path">:~$</span>
            <span class="logo-name">Davin.<span style="color:var(--accent)">Sci</span></span>
        </div>
        <nav class="filetree">
            <a href="index.html" data-page="home" class="file"><i class="fas fa-terminal"></i> home.sh</a>
            <a href="about.html" data-page="about" class="file"><i class="fas fa-file-alt"></i> about.md</a>
            <a href="skills.html" data-page="skills" class="file"><i class="fas fa-code"></i> skills.json</a>
            <a href="projects.html" data-page="projects" class="file"><i class="fas fa-folder"></i> projects/</a>
            <a href="experience.html" data-page="experience" class="file"><i class="fas fa-file-lines"></i> experience.log</a>
            <a href="organization.html" data-page="organization" class="file"><i class="fas fa-file-lines"></i> organization.log</a>
            <a href="education.html" data-page="education" class="file"><i class="fas fa-file-lines"></i> education.log</a>
            <a href="contact.html" data-page="contact" class="file"><i class="fas fa-terminal"></i> contact.sh</a>
        </nav>
        <div class="sidebar-foot"><span class="status-dot"></span> online</div>
    </aside>

    <div class="topbar">
        <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
        <span class="breadcrumb">~/<span class="current"></span></span>
    </div>

    <div class="shell">
        <main class="content">

            <div class="page-head">
                <span class="eyebrow">$ ./contact.sh</span>
                <h1>Kontak</h1>
                <p>Hubungi saya melalui informasi berikut.</p>
            </div>

            <div class="contact-container">
                <div class="contact-info">
                    <div class="contact-item"><i class="fas fa-envelope"></i><input type="email" id="email" placeholder="Email"></div>
                    <div class="contact-item"><i class="fab fa-whatsapp"></i><input type="text" id="whatsapp" placeholder="Nomor WhatsApp"></div>
                    <div class="contact-item"><i class="fab fa-instagram"></i><input type="text" id="instagram" placeholder="Instagram"></div>
                    <div class="contact-item"><i class="fab fa-github"></i><input type="text" id="github" placeholder="Github"></div>
                    <div class="contact-item"><i class="fab fa-linkedin"></i><input type="text" id="linkedin" placeholder="LinkedIn"></div>
                    <div class="contact-item"><i class="fas fa-location-dot"></i><input type="text" id="address" placeholder="Alamat"></div>
                    <button class="btn" id="saveContact">Simpan Kontak</button>
                </div>
            </div>

            <footer class="page-footer">
                <span>© 2026 Davin Scientist. All rights reserved.</span>
                <div class="footer-social">
                    <a href="#"><i class="fab fa-github"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-linkedin"></i></a>
                    <a href="#"><i class="fab fa-whatsapp"></i></a>
                </div>
            </footer>
        </main>
    </div>

    <button id="topButton"><i class="fas fa-arrow-up"></i></button>

    <script src="asset/script.js"></script>
</body>

</html>
